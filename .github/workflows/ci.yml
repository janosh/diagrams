name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.checks.result }}' = success

  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, unit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: typst-community/setup-typst@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pnpm
            ~/.npm
            ~/.cache/typst/packages
          key: checks-${{ runner.os }}-${{ hashFiles('site/package.json', 'assets/**/*.typ') }}
          restore-keys: checks-${{ runner.os }}-
      - name: Install site dependencies
        run: |
          corepack enable
          printf 'allowBuilds:\n  svelte-widgets: true\n  sharp: true\n' > pnpm-workspace.yaml
          # npm prepares Git dependencies; avoid its conflicting optional Vitest peers.
          NPM_CONFIG_LEGACY_PEER_DEPS=true pnpm install --no-lockfile --store-dir ~/.cache/pnpm
        working-directory: site
      - name: Unit tests
        if: matrix.task == 'unit'
        run: pnpm test
        working-directory: site

      - name: Run prek
        if: matrix.task == 'lint'
        uses: j178/prek-action@v3.0.0

  python-tests:
    # Artwork uses macOS fonts, including Avenir Next; match the authoring environment.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
      - uses: typst-community/setup-typst@v5
      - name: Install image tools
        run: brew install imagemagick zopfli
      - name: Python tests
        run: uv run --no-project --with pytest --with pyyaml pytest -q

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Discover broken links
        uses: lycheeverse/lychee-action@v2
        with:
          # increase max-redirects needed for some journal links
          # ${...} becomes $%7B...%7D once lychee percent-encodes the extracted URL
          args: --accept 100..=103,200..=299,403,429,500,503 --max-redirects 10 --timeout 30 --exclude-all-private --exclude '\$(\{.*\}|%7B.*%7D)' --exclude 'chemicalaid\.com' --exclude 'janosh\.github\.io/diagrams' --exclude 'diagrams\.janosh\.dev' --exclude 'arxiv\.org' --exclude 'sciencedirect\.com' --exclude 'rolandwanner\.com' --exclude 'tikz\.dev' -- ./**/*.{typ,tex,md,svelte,ts,yml}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pnpm
            ~/.npm
          key: build-deps-${{ runner.os }}-${{ hashFiles('site/package.json') }}
          restore-keys: build-deps-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        id: images
        with:
          path: site/node_modules/.cache/imagetools
          key: imagetools-${{ hashFiles('assets/**/*.png', 'site/src/lib/index.ts', 'site/package.json') }}
          restore-keys: imagetools-
      - name: Install site dependencies
        run: |
          corepack enable
          printf 'allowBuilds:\n  svelte-widgets: true\n  sharp: true\n' > pnpm-workspace.yaml
          # npm prepares Git dependencies; avoid its conflicting optional Vitest peers.
          NPM_CONFIG_LEGACY_PEER_DEPS=true pnpm install --no-lockfile --store-dir ~/.cache/pnpm
        working-directory: site
      - run: pnpm exec vite build
        working-directory: site
      - uses: actions/cache/save@v6
        if: steps.images.outputs.cache-hit != 'true'
        with:
          path: site/node_modules/.cache/imagetools
          key: ${{ steps.images.outputs.cache-primary-key }}
      - name: Install browser for visual checks
        run: pnpm exec playwright install --with-deps --only-shell chromium
        working-directory: site
      - name: Visual regression checks
        run: pnpm test:visual
        working-directory: site
      - name: Upload visual failure report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-report
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [check, python-tests, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
