title: RG Flow in Theory Space
description: |
  Visualization of [renormalization group (RG) flow](../wetterich-equation) trajectories in the theory space spanned by all coupling constants (λ₁, λ₂, λ₃, λ₄, …) allowed by the symmetries. Each trajectory uses a different infrared regulator R_k(q) and therefore starts from a different microscopic action Γ_{k=Λᵢ} = Sᵢ at its UV cutoff Λᵢ. When these initial conditions describe the same physics, all flows end at the same quantum effective action Γ = Γ_{k=0}: the path through theory space depends on the regulator, the endpoint does not.

