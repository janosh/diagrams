description: |
  A [two-dimensional convolution](https://docs.scipy.org/doc/scipy/reference/generated/scipy.signal.convolve2d.html) slides the kernel $K$ across the input image $I$ and writes the sum of elementwise products at each position into the output. The highlighted $3 \times 3$ patch, weighted by the kernel entries shown in its cell corners, sums to the highlighted output entry 4.
