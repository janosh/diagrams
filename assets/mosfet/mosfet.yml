description: |
  The [metal-oxide-semiconductor field-effect transistor](https://ocw.mit.edu/courses/6-012-microelectronic-devices-and-circuits-fall-2009/resources/mit6_012f09_lec10/), or MOSFET for short, is the most frequently manufactured device in history, with an estimated 1.3 × 10^22 MOSFETs produced between 1960 and 2018. This cross-section shows an n-channel device: n-type source and drain wells in a p-type substrate, with the gate separated from the channel region by a dielectric layer. As the basic building block of almost all modern electronics, it revolutionized the world economy and triggered our ascent into the information age.
