title: Franck-Condon Principle
tags:
  - physics
  - chemistry
  - quantum mechanics
  - spectroscopy
  - molecular physics
  - Morse potential
description: |
  Potential energy curves of a diatomic molecule in its ground and first excited electronic states, drawn as [Morse potentials](https://doi.org/10.1103/PhysRev.34.57) $V(R) = D\,(1 - e^{-a(R - R_e)})^2$ with exact vibrational levels $E_v = D\,[1 - (1 - (v + \tfrac{1}{2})/\lambda)^2]$ that crowd together toward the dissociation limit. Each shaded curve is the vibrational probability density $|\psi_v(R)|^2$ resting on its level, and dashed lines mark the rotational sublevels $E_v + B J(J+1)$, enlarged in the inset for $v'' = 2$.

  Electrons move much faster than nuclei, so an electronic transition happens at fixed internuclear distance $R$: absorption and emission are vertical arrows. Their intensities follow the Franck-Condon factors $|\langle v' | v'' \rangle|^2$, the squared overlaps of the two vibrational wavefunctions. Because the excited state has a longer, softer bond, absorption from $v'' = 0$ lands most likely in $v' = 1$ and emission from $v' = 0$ in $v'' = 1$; both arrows end on the level with the largest overlap computed from the plotted wavefunctions. Emission thus has lower energy than absorption (the Stokes shift), and the spread of Franck-Condon factors produces the vibrational progressions seen in molecular spectra.
