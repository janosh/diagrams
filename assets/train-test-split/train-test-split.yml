description: |
  Illustration of the [train-test split](https://scikit-learn.org/stable/modules/cross_validation.html) concept in machine learning. The diagram shows how a full dataset is divided into a feature matrix (X) and target vector (y), whose rows are then randomly split into training and testing subsets. The training data (X_train, y_train) is used to train a machine learning model, while the test data (X_test, y_test) is used to evaluate the model's performance on unseen data. This separation helps assess how well the model generalizes to new examples. Color coding distinguishes training rows (darker) from the randomly sampled test rows (lighter), with a [neural network](../multilayer-perceptron) representation of the ML model.
