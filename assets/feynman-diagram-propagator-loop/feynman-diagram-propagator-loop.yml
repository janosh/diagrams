title: Feynman Diagram Propagator Loop
tags:
  - physics
  - quantum field theory
description: |
  This Feynman diagram contains two [propagators](../qft-propagators) forming a loop carrying the external energy $q_0$. The labels $m_{1,2}^2$ and $\gamma_{1,2}^2$ are the squared masses and squared decay widths of the two propagators, whose spectral weight, for an expansion in Minkowski space, is concentrated around a real and positive on-shell frequency $p_0 > 0$.
