title: Isotherms
tags:
  - physics
  - thermodynamics
  - statistical mechanics
description: This image visualizes the behavior of gas isotherms (curves showing pressure-volume relationships at constant temperature), represented by three equations of state, as a function of volume. The equations include the [ideal gas law](https://openstax.org/books/university-physics-volume-2/pages/2-1-molecular-model-of-an-ideal-gas), and its first two virial corrections $B_1 / v^2$ and $B_2 / v^3$, which account for molecular interactions. The x-axis is the molar volume and the y-axis the pressure of the gas.
