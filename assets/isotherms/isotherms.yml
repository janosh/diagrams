description: This image visualizes the behavior of gas isotherms (curves showing pressure-volume relationships at constant temperature), represented by three equations of state, as a function of volume. The equations include the [ideal gas law](https://openstax.org/books/university-physics-volume-2/pages/2-1-molecular-model-of-an-ideal-gas), and two other modified laws accounting for molecular interactions. The x-axis represents the molar volume and the y-axis represents the pressure of the gas.
