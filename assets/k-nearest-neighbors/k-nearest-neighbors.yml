description: This image illustrates the [K-Nearest Neighbors](https://scikit-learn.org/stable/modules/neighbors.html) classification algorithm, showing how different values of $k$ affect classification results. Red stars represent Class A data points, green triangles represent Class B data points, and the yellow square with a question mark is a new instance to be classified. The dashed circles enclose its $k=3$ and $k=7$ nearest neighbors. A majority vote over the 3 nearest (2 triangles, 1 star) assigns Class B, while the 7 nearest (4 stars, 3 triangles) assign Class A.
source: https://link.springer.com/article/10.1007/s10668-023-03800-1/figures/5
