title: Einstein Crystal
tags:
  - physics
  - statistical mechanics
  - solid state physics
  - thermodynamics
  - phonons
  - free energy
description: |
  One poster connects the Einstein crystal's fixed-site springs to [quantum harmonic oscillators](../quantum-harmonic-oscillator), heat capacity, Debye phonons, microstate counting, and solid free energies. A lattice sketch distinguishes springs to reference sites from interactions between atoms. Quantized levels and thermal populations explain the Einstein heat-capacity curve, its low-temperature freeze-out, and the classical Dulong–Petit limit. A comparison with the Debye spectrum shows why acoustic modes give a cubic low-temperature heat capacity. Six boxed explanations connect the variables to the physics, including restoring forces, equipartition, Debye's cutoff, and the mixing parameter used in free-energy calculations.

  Six explicit allocations of two energy quanta among three modes illustrate entropy. The final panel introduces the classical [Frenkel–Ladd method](https://arxiv.org/abs/1210.3956): a reversible path connects a solvable Einstein reference to an interacting solid. The thermodynamic-integration identity uses the same positional constraint at both endpoints; releasing that constraint requires the corresponding analytic free-energy correction. Einstein and Debye temperatures are set equal only to compare curve shapes, and the heat-capacity curves describe lattice vibrations rather than electronic or magnetic contributions.
