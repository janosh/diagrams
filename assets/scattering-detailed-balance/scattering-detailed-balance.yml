title: Scattering Detailed Balance
tags:
  - physics
  - kinematics
  - particle physics
  - scattering
  - Feynman diagrams
description: A simple diagram of two-body scattering in particle physics. On the left, two incoming particles with momenta $p$ and $k$ interact and produce two outgoing particles with momenta $p'$ and $k'$; on the right is the reverse process $p', k' \to p, k$. The equals sign expresses the principle of detailed balance, which states that in equilibrium each scattering process occurs at the same rate as its reverse.
