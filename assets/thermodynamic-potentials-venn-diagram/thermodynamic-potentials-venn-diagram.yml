title: Thermodynamic Potentials Venn Diagram
description: |
  A Venn diagram of the thermodynamic potentials. Each circle stands for one conjugate pair term of the internal energy U = TS − PV + μN: mechanical (−PV), thermal (TS) and chemical (μN). Every region holds the potential made of exactly the terms of the circles containing it, e.g. F = −PV + μN in the mechanical-chemical overlap, while the outer region G_[μ] = 0 expresses the Gibbs-Duhem relation. The subscript μ denotes an N-to-μ [Legendre transform](../thermo-ensemble-trafos) of the indicated potential (U, H, F, or G). The diagram helps visualize how different thermodynamic quantities are related through Legendre transforms.

citation: |
  R. K. P. Zia, Edward F. Redish, and Susan R. McKay, "Thermodynamic Venn diagrams: Sorting out forces, fluxes, and Legendre transforms," American Journal of Physics 79, 950 (2011). DOI: 10.1119/1.3599177

