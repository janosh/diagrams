title: DFT Jacob's Ladder
description: |
  A visualization of Perdew's Jacob's ladder of [density functional theory (DFT)](../dft-choices), representing a hierarchy of increasingly sophisticated approximations to the [exchange-correlation energy (E_xc)](../xc-functional). The ladder climbs from the Hartree approximation (no exchange-correlation) through local density approximations to accurate but expensive double-hybrid functionals one rung below chemical accuracy, with each rung adding new physical ingredients to improve accuracy at the cost of computational complexity.

references:
  - perdew_jacobs_2001:
      title: Jacob's ladder of density functional approximations for the exchange-correlation energy
      authors: John P. Perdew, Karsten Schmidt
      year: 2001
      publisher: AIP Conference Proceedings
      doi: 10.1063/1.1390175
      page: 1

