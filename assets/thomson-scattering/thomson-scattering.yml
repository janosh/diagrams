title: Thomson Scattering
creator: Stefan Bringuier
creator_url: https://stefanbringuier.info
date: 2024-01-09
tags:
  - physics
description: |
  Classical elastic scattering of light by a free electron. The incident electric field drives the electron's oscillation, and the accelerated charge reradiates. A highlighted outgoing wave defines the scattering angle $\theta$ relative to the forward direction. Incident and scattered waves have the same wavelength and photon energy in the Thomson limit $h\nu \ll m_e c^2$, where recoil is neglected. The gray rays indicate other possible emission directions schematically.
