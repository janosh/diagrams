title: Cost vs Accuracy in Quantum Mechanical Simulations
tags:
  - physics
  - quantum mechanics
  - solid state physics
  - density functional theory
description: |
  A schematic cost–accuracy plot for molecular energies near equilibrium, where a single-reference description is appropriate. Horizontal positions show conventional dense-algorithm scaling with basis size N: [semilocal DFT](../dft-jacobs-ladder) O(N³), Hartree–Fock O(N⁴), MP2 O(N⁵), CCSD O(N⁶), and CCSD(T) O(N⁷). Vertical positions illustrate a common qualitative tradeoff; they are not benchmark data, error bars, or a universal ranking. DFT performance depends strongly on the functional and observable; it can outperform more expensive wavefunction methods on particular problems. The absent diagonal is intentional: cost alone does not determine accuracy.

  The exponents are not timing predictions. Prefactors, screening, density fitting, local correlation, convergence, and hardware change practical cost. Compare the same observable and system with converged basis sets and a stated error target. MP2 and single-reference coupled cluster can fail near degeneracy or [strong correlation](../h2-bond-breaking); perturbative triples cannot repair a poor reference. Generic “configuration interaction” and “coupled cluster” labels are avoided because truncation level changes both cost and behavior.

  References: [Psi4 FNOCC methods](https://psi4.github.io/psi4docs/master/fnocc.html), [conventional cubic DFT and linear-scaling alternatives](https://arxiv.org/abs/1501.05884), and [limits of the CCSD(T) accuracy hierarchy](https://pmc.ncbi.nlm.nih.gov/articles/PMC11571224/).
