title: Ising Model Phase Transition
tags:
  - physics
  - statistical mechanics
  - phase-transitions
  - ising model
  - monte carlo
  - critical phenomena
description: Onsager's exact spontaneous magnetization of the 2D square-lattice Ising model, $m(T) = \left[1 - \sinh^{-4}(2J / k_B T)\right]^{1/8}$, which vanishes continuously at $T_c = 2J / [k_B \ln(1 + \sqrt{2})] \approx 2.269\,J/k_B$ with exponent $\beta = 1/8$. The $40 \times 40$ snapshots come from a Metropolis Monte Carlo simulation run in Typst at $k_B T / J = 1.5$, $T_c$ and $3.5$, showing an ordered ferromagnet, large ragged domains near [criticality](../critical-temperature) (after 300 sweeps, still coarsening toward the fractal equilibrium clusters), and a disordered paramagnet.
