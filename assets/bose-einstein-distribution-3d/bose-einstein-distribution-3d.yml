title: Bose-Einstein Distribution 3D
tags:
  - physics
  - statistical mechanics
  - Matsubara
description: |
  Surface plot of the magnitude $|n_\text{B}(p_0)| = |1/(e^{p_0/T} - 1)|$ of the [Bose-Einstein distribution](../particle-statistics) continued to complex frequencies $p_0$ (here $T = 1$, with the divergent peaks clipped at height 2). Its poles on the imaginary axis sit at the bosonic Matsubara frequencies $p_0 = 2 \pi i n T$, which is what makes $n_\text{B}$ central to the [Matsubara formalism](../matsubara-contours) of finite-temperature QFT: thermal expectation values in a canonical ensemble are computed by evolving in imaginary time, so continuous frequency integrals become sums over these discrete imaginary frequencies. Away from the imaginary axis the surface quickly flattens, approaching 1 for $\operatorname{Re}(p_0) \ll -T$ and 0 for $\operatorname{Re}(p_0) \gg T$. Pulled from [arxiv:1712.09863](https://arxiv.org/abs/1712.09863).
