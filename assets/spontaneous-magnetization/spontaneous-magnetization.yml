title: Spontaneous Magnetization
tags:
  - physics
  - solid state physics
  - magnetism
description: |
  Spontaneous magnetization $m$ of the 2D [Ising ferromagnet](../magnetism-types) (Onsager's exact solution) appears below the [critical temperature](../critical-temperature) $T_c$. Near $T_c$ it vanishes as $m \propto (T_c - T)^{1/8}$, so its derivative diverges in the limit $T \to T_c^-$.
