description: |
  The [Burrows-Wheeler transform](https://www.cs.jhu.edu/~langmea/resources/burrows_wheeler.pdf) lists all cyclic rotations of a string, sorts them lexicographically, and reads off the last column together with the row index of the original string. In the first table, red marks the suffix of $T$ that starts each sorted rotation; in the second, red marks the last column and the row holding $T$ itself (row 2).
