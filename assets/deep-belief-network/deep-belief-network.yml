description: |
  A compact generative deep belief network: the top hidden pair forms an undirected restricted Boltzmann machine, while downward directed connections generate the visible variables. Based on [Hinton et al. (2006)](https://www.cs.toronto.edu/~hinton/absps/fastnc.pdf).
