description: |
  A three-step rollout of a [greedy policy](https://mitpress.mit.edu/9780262039246/reinforcement-learning/) in a small grid world. In each state $s_t$, the policy $\pi_\theta(s_t)$ scores the available actions and the agent takes the highest-scoring one (bold), receiving reward $\mathcal{R}(s_t, a_t)$ and moving to the next state via the transition $\mathcal{T}(s_t, a_t)$. Moving up and right earns nothing, while picking up the money (green dollar signs) at the goal earns $r_2 = 2$.
