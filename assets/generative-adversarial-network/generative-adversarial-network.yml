description: |
  [Generative adversarial network (GAN)](https://arxiv.org/abs/1406.2661) architecture. A GAN has two parts. The generator $G$ maps latent noise $\vec z \sim p_z$ to fake samples. The discriminator $D$ acts as a classifier that learns to distinguish these fake samples from real data. $G$ incurs a penalty when $D$ detects implausible results. This signal is backpropagated through $D$ into the generator weights such that $G$ learns to produce more realistic samples over time, eventually fooling the discriminator if training succeeds.
