title: Convex Hull of Stability
tags:
  - materials science
  - thermodynamics
  - phase diagram
description: |
  Adapted from [Bartel (2022)](https://doi.org/10.1007/s10853-022-06915-4).
  The convex hull of stability represents the lowest energy surface in composition space for a given chemical system. It is constructed by connecting the energies of the most thermodynamically stable compounds at each composition. For visual clarity, only ground-state phases at each composition are shown. Legend:

  - Blue circles: Stable phases lying on the convex hull (blue line)
  - Red squares: Unstable phases above the hull
  - Orange dashed line: Extension of the AX–A₂X₅ hull facet to x = 0. Its intercept and the energy of A bound the chemical potential range of A (orange arrow) where AX is stable
  - ΔE_d: Decomposition enthalpy, the energy above the hull for unstable phases (A₂X), or the negative distance below the hull constructed without it for stable phases (A₂X₅)

  Materials on the hull are stable against decomposition into other phases. The energy difference between a material and the hull (hull distance) quantifies its thermodynamic stability, with larger distances meaning less stable and harder to synthesize, making the convex hull a powerful tool for guiding experimental synthesis efforts.
