title: Periodic Table
creator: Ivan Griffin
url: https://texample.net/tikz/examples/periodic-table-of-chemical-elements
tags:
  - physics
  - chemistry
description: The [periodic table of elements](https://iupac.org/what-we-do/periodic-table-of-elements/), a graphic formulation of the periodic dependence of elemental properties on their atomic numbers. The table is divided into four roughly rectangular areas called blocks. Rows are called periods, columns are groups. Elements from the same group show similar chemical characteristics. Trends run through the periodic table, with nonmetallic character (keeping their own electrons) increasing from left to right across a period and from bottom to top within a group, and metallic character (surrendering electrons to other atoms) increasing in the opposite direction. Symbols of man-made transuranic elements (Z > 92) are shown in gray.
