title: Maxwell Boltzmann Distribution
tags:
  - physics
  - statistical mechanics
  - thermodynamics
description: The [Maxwell-Boltzmann](../particle-statistics) speed distribution $P(v)$ for ideal gas particles of mass 1 u at 100, 300 and 1000 K. Higher temperatures broaden and flatten the curve, and the most probable speed $v_p = \sqrt{2 k_B T / m}$ grows with the square root of temperature.
