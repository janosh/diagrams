title: Cylinder to Plane
tags:
  - physics
  - string theory
  - topology
description: |
  [Radial quantization](https://davidtong.org/pdfs/teaching/string-theory/string4.pdf#page=35) in string theory: the conformal map $z = e^{\tau - i\sigma}$ sends the closed-string cylinder with time $\tau$ and spatial coordinate $\sigma$ to the complex plane. Constant-time slices $\tau_1 < \tau_2$ become concentric circles of radius $e^{\tau}$, the infinite past maps to the origin, and time-ordered products of fields on the cylinder become radially ordered products on the plane.
