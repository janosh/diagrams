title: Materials Informatics
tags:
  - machine learning
  - info-graphics
description: |
  A visual structure-to-property workflow: an acetamide molecule becomes a Coulomb-matrix heatmap, a trained model maps that representation to a predicted property, and the output shown is isotropic polarizability. The molecule includes its carbonyl double bond. The network is schematic; its drawn node counts do not specify the actual input dimensions or architecture. The workflow was inspired by [this Computer Physics Communications paper](https://doi.org/10.1016/j.cpc.2019.106949).

  The heatmap is computed from the nine atoms in the drawing, using the [Coulomb-matrix definition](https://singroup.github.io/dscribe/latest/tutorials/descriptors/coulomb_matrix.html): diagonal entries encode nuclear charge and off-diagonal entries encode charge products divided by distance. Darker cells represent larger values, with square-root color scaling to reveal small entries. These are illustrative drawing coordinates, not an optimized three-dimensional geometry or physical descriptor values. Real inputs require physical coordinates and consistent units. The raw matrix is invariant to translation and rotation, but its rows and columns change under atom reindexing; a model needs an explicit strategy for atom permutations.

  Data: record units, calculation settings, provenance, and versions; deduplicate structures and group train/test splits by the intended generalization task. Representation: scalar targets should respect translation, rotation, and permutation invariance; vector and tensor targets require the appropriate equivariance. Evaluation: hold out chemical families or physical regimes, calibrate uncertainty when provided, compare useful baselines, and check physical constraints. Report reproducibility, inference cost, and the validated domain. Choose the property and acceptable error before choosing a model. These checks retain the practical guidance from the former Materials Informatics Challenges entry without crowding the illustration.
