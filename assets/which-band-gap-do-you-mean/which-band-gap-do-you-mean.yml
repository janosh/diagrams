title: Which Band Gap Do You Mean?
tags:
  - physics
  - density functional theory
  - electronic structure
  - semiconductors
  - spectroscopy
description: |
  Three complementary pictures distinguish a [Kohn–Sham](../kohn-sham-cycle) orbital gap, the fundamental gap measured through electron addition and removal, and the optical gap for a neutral excitation. A shared energy axis shows how the exchange-correlation [derivative discontinuity](https://doi.org/10.1103/PhysRevLett.51.1884) $\Delta_\text{xc}$ raises the exact Kohn–Sham gap to the fundamental gap $E_\text{g} = I - A$, and how the exciton binding energy lowers it to the optical gap at a matching direct threshold. Plain-language labels explain holes, excitons, ionization energy, electron affinity, and the conditions needed when comparing experimental and calculated gaps, including indirect transitions and dark states.
