title: ROC Curve
tags:
  - statistics
  - classification
  - machine learning
  - performance metrics
  - data science
  - model evaluation
description: >-
  The Receiver Operating Characteristic curve plots the true positive rate (sensitivity) against
  the false positive rate (1 − specificity) as the classification threshold is swept. Six
  classifiers are shown, from near-perfect (AUC = 0.99) down to poor (AUC = 0.65), against the
  diagonal a random guess would trace (AUC = 0.5). The area under each curve summarizes
  performance independently of any single threshold, so the ordering of the curves holds however
  the operating point is later chosen.
