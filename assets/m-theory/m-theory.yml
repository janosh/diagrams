title: M-Theory
tags:
  - physics
  - string theory
description: |
  One of the pivotal insights of the 2nd superstring revolution was [Edward Witten's formulation of M-Theory in 1995](https://arxiv.org/abs/hep-th/9503124). Before that, there had been 5 different 10-dimensional superstring theories: Type I, Type IIA and IIB, and the two heterotic theories with gauge groups $SO(32)$ and $E_8 \times E_8$. Witten showed that all of them are different limits of a single 11-dimensional theory (without showing what that underlying theory actually is), linked by dualities: T-duality relates IIA to IIB and the two heterotic theories to each other, S-duality relates Type I to heterotic $SO(32)$, Type I is the orientifold of IIB, and IIA and heterotic $E_8 \times E_8$ arise from M-theory compactified on a circle and an interval, respectively. See Sean [Carroll's excellent post](https://preposterousuniverse.com/blog/2014/03/12) on M-Theory for details.
