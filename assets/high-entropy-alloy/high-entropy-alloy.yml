description: |
  Cartoon of the AlCoCrFeNi high entropy alloy (HEA) with body-centered cubic (BCC) lattice. HEAs also come in face-centered cubic (FCC) and (less frequently) hexagonal close-packed (HCP) lattices. BCC HEAs typically combine high yield strength with low ductility, while FCC HEAs tend to be softer but more ductile. [Wiki article](https://wikipedia.org/wiki/High_entropy_alloys).
