description: |
  Schematic representation of [ferroelectric response](https://wikipedia.org/wiki/Ferroelectricity) for [BaTiO₃](https://materialsproject.org/materials/mp-2998) depicting the double-well free energy potential and polarization plots. The unit cells (Ba cyan, O red, Ti gray) illustrate the movement of the titanium atom within the [crystal lattice](../basis-plus-lattice) as it shifts off-center between two stable positions, corresponding to the minima of the free energy curve, while the centered configuration sits at the unstable barrier. The polarization grows linearly with this Ti displacement and changes sign as the atom moves from one well to the other.
