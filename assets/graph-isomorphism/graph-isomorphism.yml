title: Graph Isomorphism
tags:
  - math
  - symmetry
  - graphs
description: Graphs can look different but be identical. The only thing that matters is which nodes are connected to which other nodes. If there exists an edge-preserving bijection between two graphs, in other words a function that maps the nodes of one graph onto those of another such that the set of connections of each node remains identical, the two graphs are said to be [isomorphic](https://networkx.org/documentation/stable/reference/algorithms/isomorphism.html). All four drawings show the same 4-cycle $n_1 n_2 n_3 n_4$, with matching node labels and colors marking the isomorphism.
